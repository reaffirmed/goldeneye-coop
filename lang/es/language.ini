; GoldenEye Coop language pack: Spanish (lang/README.md)
;
; The game's own text is Sogun and IlDucci's Spanish translation, v2.0: their
; GE-ESP-NTSC.xdelta for the GoldenEye 007 (USA) cart, applied in memory to
; each player's own cart when the game starts. Their readme, leeme.txt, comes
; with it as its terms ask ("se adjunte este documento de texto").
; The port's own text (menus, settings, co-op and versus) is port.po.

name = Español
patch = GE-ESP-NTSC.xdelta
strings = port.po

; the patch draws its accented letters over punctuation the game never shows;
; each pair is that ASCII character, then the letter it is in the patch
glyphs = #º $í &ó /ú [á ]é {¡ |ñ }¿

; the port's relabels of three of the watch's option values, in Spanish
bank.LoptionsE.24 = hud
bank.LoptionsE.34 = 4:3
bank.LoptionsE.35 = ancho
