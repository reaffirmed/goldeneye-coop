name: PC-Port-Build

on:
  push:
    paths-ignore: 
    - 'tools/**'
    - '*.md'
    - '.gitignore'
    - 'CppProperties.json'
  pull_request:
  workflow_dispatch:

# SDL2 mingw devel package version used for the Windows cross-build; must match
# the third_party/SDL2-<version>/i686-w64-mingw32 path CMakeLists.txt expects.
env:
  SDL2_VERSION: 2.30.11
  SDL2_MINGW_SHA1: a44b17a6521b40e04d7beaae90b4b3ce19e62e7b
  SDL2_SRC_SHA1: f3cdd91df44653518d4f3db5fdc775170016aa85
  BASEROM_US_SHA1: abe01e4aeb033b6c0836819f549c791b26cfde83
  ROM_URL: ${{ secrets.ROM_URL }}

jobs:
  build-linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # full history: the build number is git's commit count, and a
          # depth-1 clone would stamp every artifact "Build 1" (G136)
          fetch-depth: 0

      # Without a ROM_URL secret the ROM steps are skipped: the build needs
      # no ROM-extracted files (see coop-windows.yml)
      - name: Get US File
        if: env.ROM_URL != ''
        run: wget -U "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" -O baserom.u.z64 "$ROM_URL"

      - name: Verify US File checksum
        if: env.ROM_URL != ''
        run: echo "${BASEROM_US_SHA1}  baserom.u.z64" | sha1sum -c -

      - name: Extract US Assets
        if: env.ROM_URL != ''
        run: ./scripts/extract_baserom.u.sh

      - name: Convert model binaries and combine images
        if: env.ROM_URL != ''
        run: make convert_props convert_chrs convert_guns combine_images

      - name: Install Linux (i686) build dependencies
        # The i386 mirror sometimes stalls for 40+ minutes. Each apt call gets
        # 5 minutes and a stalled try starts over, so a slow mirror costs a
        # few minutes instead of the whole run
        timeout-minutes: 25
        run: |
          sudo dpkg --add-architecture i386
          APT="timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for try in 1 2 3; do
            sudo $APT update && sudo $APT install -y cmake gcc-multilib g++-multilib \
            libx11-dev:i386 libxext-dev:i386 libxrandr-dev:i386 libxcursor-dev:i386 \
            libxfixes-dev:i386 libxi-dev:i386 libxss-dev:i386 libasound2-dev:i386 \
            libudev-dev:i386 libgl-dev:i386 && break
            [ $try = 3 ] && exit 1
            echo "apt-get try $try stalled or failed, retrying"; sudo dpkg --configure -a || true; sleep 10
          done

      - name: Cache SDL2 (i686) build
        id: cache-sdl2-linux
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/sdl2-linux-i686
          key: sdl2-linux-i686-${{ env.SDL2_VERSION }}-v2

      - name: Build SDL2 from source (i686)
        if: steps.cache-sdl2-linux.outputs.cache-hit != 'true'
        run: |
          # Ubuntu's libsdl2-dev:i386 depends on libibus-1.0-dev/libpulse-dev,
          # which depend on a currently-broken i386 libglib2.0-dev. Building
          # SDL2 from source sidesteps that package entirely; those backends
          # are dlopen'd at runtime and aren't needed to compile SDL2.
          wget -O sdl2-src.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-${SDL2_VERSION}.tar.gz"
          echo "${SDL2_SRC_SHA1}  sdl2-src.tar.gz" | sha1sum -c -
          mkdir -p sdl2-src
          tar -xzf sdl2-src.tar.gz --strip-components=1 -C sdl2-src
          cmake -S sdl2-src -B sdl2-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS=-m32 -DCMAKE_CXX_FLAGS=-m32 \
            -DCMAKE_SHARED_LINKER_FLAGS=-m32 -DCMAKE_EXE_LINKER_FLAGS=-m32 \
            -DCMAKE_INSTALL_PREFIX="$HOME/sdl2-linux-i686" -DCMAKE_INSTALL_LIBDIR=lib/i386-linux-gnu \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF \
            -DSDL_WAYLAND=OFF -DSDL_IBUS=OFF -DSDL_FCITX=OFF -DSDL_DBUS=OFF \
            -DSDL_PULSEAUDIO=OFF -DSDL_JACK=OFF -DSDL_SNDIO=OFF -DSDL_LIBSAMPLERATE=OFF \
            -DSDL_X11=ON -DSDL_OPENGL=ON -DSDL_ALSA=ON
          cmake --build sdl2-build -j$(nproc)
          cmake --install sdl2-build

      - name: Configure and build for Linux (x86)
        run: |
          cmake -B build_pc -DCMAKE_BUILD_TYPE=Debug -DGE_VIDEO=ON -DSDL2_LINUX_ROOT="$HOME/sdl2-linux-i686"
          cmake --build build_pc -j$(nproc)

      # upload-artifact drops file permissions, so the binary goes up inside a
      # tar that keeps its exec bit (G334). It still needs an i386 libSDL2 on
      # the machine that runs it: the RUNPATH points at the runner's own copy.
      - name: Pack Linux executable
        run: |
          chmod +x build_pc/ProjectMidas
          tar -cf ProjectMidas-linux-x86.tar -C build_pc ProjectMidas

      - name: Upload Linux executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ProjectMidas-linux-x86
          path: ProjectMidas-linux-x86.tar
          retention-days: 3

  build-windows:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # full history: the build number is git's commit count, and a
          # depth-1 clone would stamp every artifact "Build 1" (G136)
          fetch-depth: 0

      # Without a ROM_URL secret the ROM steps are skipped: the build needs
      # no ROM-extracted files (see coop-windows.yml)
      - name: Get US File
        if: env.ROM_URL != ''
        run: wget -U "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36" -O baserom.u.z64 "$ROM_URL"

      - name: Verify US File checksum
        if: env.ROM_URL != ''
        run: echo "${BASEROM_US_SHA1}  baserom.u.z64" | sha1sum -c -

      - name: Extract US Assets
        if: env.ROM_URL != ''
        run: ./scripts/extract_baserom.u.sh

      - name: Convert model binaries and combine images
        if: env.ROM_URL != ''
        run: make convert_props convert_chrs convert_guns combine_images

      - name: Install Windows (i686) cross-build dependencies
        # Same guard as the Linux install: a stalled apt mirror costs a few
        # minutes, not the whole run
        timeout-minutes: 25
        run: |
          APT="timeout 300 apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          for try in 1 2 3; do
            sudo $APT update && sudo $APT install -y cmake gcc-mingw-w64-i686 g++-mingw-w64-i686 binutils-mingw-w64-i686 && break
            [ $try = 3 ] && exit 1
            echo "apt-get try $try stalled or failed, retrying"; sudo dpkg --configure -a || true; sleep 10
          done

      - name: Cache SDL2 mingw devel package
        id: cache-sdl2-windows
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: third_party/SDL2-${{ env.SDL2_VERSION }}
          key: sdl2-windows-mingw-${{ env.SDL2_VERSION }}-v1

      - name: Get SDL2 mingw devel package
        if: steps.cache-sdl2-windows.outputs.cache-hit != 'true'
        run: |
          wget -O sdl2-mingw.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL2_VERSION}/SDL2-devel-${SDL2_VERSION}-mingw.tar.gz"
          echo "${SDL2_MINGW_SHA1}  sdl2-mingw.tar.gz" | sha1sum -c -
          mkdir -p third_party
          tar -xzf sdl2-mingw.tar.gz -C third_party

      - name: Configure and build for Windows (x86)
        run: |
          cmake -B build_win -DCMAKE_TOOLCHAIN_FILE=cmake/mingw-i686.cmake -DCMAKE_BUILD_TYPE=Debug -DGE_VIDEO=ON
          cmake --build build_win -j$(nproc)

      - name: Upload Windows executable
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ProjectMidas-windows-x86
          path: build_win/ProjectMidas.exe
          retention-days: 3
